<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c9d1d9"/>
    </marker>
  </defs>
  <style>
    .b { fill:none; stroke:#c9d1d9; stroke-width:1.5; rx:6 }
    .t { font-size:13px; fill:#e6edf3; text-anchor:middle }
    .s { font-size:11px; fill:#8b949e; text-anchor:middle }
    .w { stroke:#c9d1d9; stroke-width:1.5; marker-end:url(#ar); fill:none }
    .pin { font-size:12px; fill:#e6edf3 }
  </style>

  <!-- title row: transport in -->
  <text x="20" y="30" class="pin">transport: MCLK C11 · BCLK C10 · LRCK D11 · SDATA B11</text>

  <!-- PCM row -->
  <rect x="20" y="50" width="130" height="52" class="b"/>
  <text x="85" y="71" class="t">i2s_receiver</text>
  <text x="85" y="87" class="s">slave · 32→24b</text>

  <rect x="180" y="50" width="110" height="52" class="b"/>
  <text x="235" y="71" class="t">rate_detect</text>
  <text x="235" y="87" class="s">D2/X1/X2/X4</text>

  <rect x="320" y="50" width="150" height="52" class="b"/>
  <text x="395" y="71" class="t">src_interp</text>
  <text x="395" y="87" class="s">X1/D2 dup · X2/X4 FIR</text>

  <rect x="500" y="50" width="110" height="52" class="b"/>
  <text x="555" y="71" class="t">fade + mute</text>
  <text x="555" y="87" class="s">PCM/DSD env</text>

  <rect x="640" y="50" width="100" height="52" class="b"/>
  <text x="690" y="71" class="t">TPDF</text>
  <text x="690" y="87" class="s">24→16</text>

  <line x1="150" y1="76" x2="178" y2="76" class="w"/>
  <line x1="290" y1="76" x2="318" y2="76" class="w"/>
  <line x1="470" y1="76" x2="498" y2="76" class="w"/>
  <line x1="610" y1="76" x2="638" y2="76" class="w"/>

  <!-- DSD row -->
  <rect x="20" y="150" width="150" height="52" class="b"/>
  <text x="95" y="171" class="t">dsd_to_pcm</text>
  <text x="95" y="187" class="s">1024-tap FIR → 352.8k</text>

  <rect x="200" y="150" width="130" height="52" class="b"/>
  <text x="265" y="171" class="t">decim /2 + round</text>
  <text x="265" y="187" class="s">→ 176.4k S24</text>

  <line x1="170" y1="176" x2="198" y2="176" class="w"/>
  <line x1="330" y1="176" x2="430" y2="176" class="w"/>
  <line x1="430" y1="176" x2="430" y2="104" class="w"/>
  <line x1="430" y1="104" x2="498" y2="104" class="w"/>

  <text x="20" y="140" class="pin">DSD: bitclk C10 · DATA1 B11 · DATA2 D11/G10 · dsd_on G11</text>

  <!-- outputs -->
  <rect x="320" y="240" width="150" height="52" class="b"/>
  <text x="395" y="261" class="t">i2s_transmitter</text>
  <text x="395" y="277" class="s">master 16b · E11/A11/K11</text>

  <rect x="500" y="240" width="150" height="52" class="b"/>
  <text x="575" y="261" class="t">tda1541_tx</text>
  <text x="575" y="277" class="s">simultaneous · H5/F5/G7/H8</text>

  <line x1="690" y1="102" x2="690" y2="222" class="w" style="marker-end:none"/>
  <line x1="395" y1="222" x2="690" y2="222" class="w" style="marker-end:none"/>
  <line x1="395" y1="222" x2="395" y2="238" class="w"/>
  <line x1="575" y1="222" x2="575" y2="238" class="w"/>
</svg>
